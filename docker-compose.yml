services:
  blog:
    build: .
    container_name: blog-material-you
    ports:
      - "8000:30999"
      - "8002:31000"
    environment:
      - BMY_BLOG_DIR=/app/blog
      # ===== Database (MariaDB/MySQL on the Docker host) =====
      # The image does NOT embed a database server — the blog connects to an
      # external MariaDB/MySQL via a connection URL (`mariadb://` or
      # `mysql://` are both accepted). The default below points at the
      # database running on the Docker host; change the credentials to match
      # your server, and replace host.docker.internal if it is elsewhere.
      - BMY_DB_URL=mariadb://blogyou:blog-db-pass-2025@host.docker.internal:3306/blogyou
      # ===== S3 image hosting (external S3-compatible store, default off) =====
      # Optional: set BMY_IMGHOST_PROVIDER=s3 plus the BMY_S3_* values (e.g.
      # in your .env) to store uploaded images on MinIO / AWS S3 / Cloudflare
      # R2 / any S3-compatible service instead of the built-in SFTP provider.
      - BMY_IMGHOST_PROVIDER=${BMY_IMGHOST_PROVIDER:-}
      - BMY_S3_ENDPOINT=${BMY_S3_ENDPOINT:-}
      - BMY_S3_BUCKET=${BMY_S3_BUCKET:-}
      - BMY_S3_ACCESS_KEY=${BMY_S3_ACCESS_KEY:-}
      - BMY_S3_SECRET_KEY=${BMY_S3_SECRET_KEY:-}
      - BMY_S3_REGION=${BMY_S3_REGION:-}
      - BMY_S3_PREFIX=${BMY_S3_PREFIX:-}
      - BMY_S3_PUBLIC_URL_BASE=${BMY_S3_PUBLIC_URL_BASE:-}
      - BMY_S3_INSECURE=${BMY_S3_INSECURE:-0}
      # S3 TLS / mutual TLS (paths inside the container; mount certs):
      # - BMY_S3_SSL_CA=/certs/ca.pem
      # - BMY_S3_SSL_CERT=/certs/client.crt
      # - BMY_S3_SSL_KEY=/certs/client.key
      # - ./certs:/certs:ro
    extra_hosts:
      # Resolve host.docker.internal to the Docker host (Linux), so the
      # container can reach the database listening on the host machine.
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist admin credentials and runtime data
      - blog_data_etc:/app/blog/data
      # Mount posts/pages/friends/talks for easy editing from host
      - ./blog/posts:/app/blog/posts
      - ./blog/pages:/app/blog/pages
      - ./blog/friends:/app/blog/friends
      - ./blog/talks:/app/blog/talks
    restart: unless-stopped

volumes:
  blog_data_etc:
