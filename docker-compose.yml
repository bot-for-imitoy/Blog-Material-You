# Blog Material You — single-container deployment.
#
# There is no database service: the blog is file-based (Hexo-like), so the only
# state to persist is ./blog (content) plus the named volume for blog/data
# (credentials, comments, visitors, settings).
services:
  blog:
    build: .
    container_name: blog-material-you
    ports:
      - "8000:30999"            # public blog + API (no admin surface here)
      - "127.0.0.1:31001:31001" # admin console — keep it off the public interface
      - "31000:31000"           # standalone profile card (/profile/)
    environment:
      - BMY_BLOG_DIR=/app/blog
      # Admin console / API port. Publish it behind its own domain (or an SSH
      # tunnel); set BMY_ADMIN_TLS_* to serve it over TLS / mutual TLS.
      - BMY_ADMIN_PORT=31001
      # Server TLS for the admin port:
      #   - BMY_ADMIN_TLS_CERT=/certs/admin-server.pem
      #   - BMY_ADMIN_TLS_KEY=/certs/admin-server-key.pem
      # Client CA enables mutual TLS (client certificates required):
      #   - BMY_ADMIN_TLS_CA=/certs/admin-client-ca.pem
      # Mark auth cookies Secure once everything is HTTPS:
      #   - BMY_COOKIE_SECURE=1
      # Canonical site URL — used for canonical tags, the sitemap and RSS.
      # Set this to the public address of your deployment.
      - BMY_SITE_URL=${BMY_SITE_URL:-}
      # HMAC key for admin sessions. Leave empty and the app generates one into
      # blog/data/secret.json on first start; set it explicitly so sessions
      # survive a volume reset.
      - BMY_SESSION_SECRET=${BMY_SESSION_SECRET:-}
      # First-run admin bootstrap. Only applied while no admin account exists,
      # so a password changed in the UI is never reverted on restart.
      # Forgotten password? There is deliberately no reset env var — run:
      #   docker compose exec blog npm run passwd-reset -- --clear
      - BMY_ADMIN_USER=${BMY_ADMIN_USER:-admin}
      - BMY_ADMIN_PASS=${BMY_ADMIN_PASS:-}
      # ===== Image hosting (optional) =====
      # Set BMY_IMGHOST_PROVIDER=s3 plus the BMY_S3_* values to store uploaded
      # images on MinIO / AWS S3 / Cloudflare R2 instead of the local disk.
      - BMY_IMGHOST_PROVIDER=${BMY_IMGHOST_PROVIDER:-}
      - BMY_S3_ENDPOINT=${BMY_S3_ENDPOINT:-}
      - BMY_S3_BUCKET=${BMY_S3_BUCKET:-}
      - BMY_S3_ACCESS_KEY=${BMY_S3_ACCESS_KEY:-}
      - BMY_S3_SECRET_KEY=${BMY_S3_SECRET_KEY:-}
      - BMY_S3_REGION=${BMY_S3_REGION:-}
      - BMY_S3_PREFIX=${BMY_S3_PREFIX:-}
      - BMY_S3_PUBLIC_URL_BASE=${BMY_S3_PUBLIC_URL_BASE:-}
      - BMY_S3_INSECURE=${BMY_S3_INSECURE:-0}
      # S3 TLS / mutual TLS (paths inside the container; mount your certs):
      # - BMY_S3_SSL_CA=/certs/ca.pem
      # - BMY_S3_SSL_CERT=/certs/client-bundle.pem
      # - BMY_S3_SSL_KEY=/certs/client-bundle.pem
    volumes:
      # Credentials, comments, visitors, TOTP state, image-host settings.
      - blog_data:/app/blog/data
      # Content — mounted so it can be edited from the host.
      - ./blog/posts:/app/blog/posts
      - ./blog/pages:/app/blog/pages
      - ./blog/talks:/app/blog/talks
      - ./blog/friends:/app/blog/friends
      # Uploaded avatars.
      - ./blog/public/avatars:/app/blog/public/avatars
    restart: unless-stopped

volumes:
  blog_data:
