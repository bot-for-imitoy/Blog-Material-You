# ============================================================================
#  Blog Material You — 站点配置文件
# ============================================================================
#  这是本站唯一需要修改的配置文件（类似 Hexo 的 _config.yml）。
#  站点名称、简介、头像、导航菜单、功能开关、列表长度、界面文案都在这里。
#
#  · 只写你想改的键即可，未写的键会自动使用内置默认值。
#  · 保存后立即生效，无需重启服务（按文件修改时间自动重载）。
#  · 语法是 YAML：用两个空格缩进，不要用 Tab；字符串一般不必加引号，
#    但以 # 开头或包含 : 的值请用引号包起来。
#
#  不放在这里的内容：端口、监听地址、会话密钥、管理员初始密码、S3 密钥等
#  「因部署而异 / 属于机密」的设置，仍然使用环境变量（见 .env.example）。
# ============================================================================

# ===== 站点信息 =====

# 站点名称。显示在侧边栏、顶栏、浏览器标题与订阅源中。
title: imitoy's Blog

# 副标题 / 一句话简介。显示在侧边栏站点名称下方。
subtitle: 暂无简介

# 站点描述。用于页面的 meta description 与 Open Graph；留空则沿用 subtitle。
description: 一个使用 Node.js 与 Material You 构建的博客

# 关键词（数组）。写入页面的 meta keywords，可留空。
keywords: []

# 作者名。写入 meta author。留空则不输出。
author: ''

# 页面语言，写入 <html lang="…">。
language: zh-CN

# 站点对外地址，用于 canonical 链接、sitemap.xml 与 rss.xml。
# 例如 https://blog.example.com（末尾不要加 /）。留空则使用相对路径。
url: ''

# ===== 外观 =====

# 头像图片地址（相对于 public 目录，或完整的 http(s) 地址）。
avatar: /img/avatar.jpg

# 页脚版权文字。
copyright: © 2025 Blog Material You

# 侧边栏 / 页脚展示的 GitHub 地址，可留空。
github: https://github.com/imitoy/Blog

theme:
  # 主题色。mdui 会据此生成整套 Material You 配色方案，同时作为浏览器地址栏
  # 配色（<meta name="theme-color">）输出。
  # 也可以在后台「站点设置」页面直接修改并实时预览——保存时会写回本文件。
  # 必须是十六进制：#rgb、#rrggbb 或 #rrggbbaa。
  # （mdui 的配色方案由该值生成，只接受十六进制：rgb(...) 会让生成失败，
  #   颜色名如 tomato 会被当作黑色，导致整站变成灰色。）
  color: '#f2aa00'

# ===== 导航菜单 =====
# text    菜单文字
# route   目标地址
# icon    图标路径（public 目录下，或完整地址）
# pageTitle / pageDesc 可选，取值为下方 strings 里的键名，用于该页面的标题与说明
menu:
  - text: 首页
    icon: /icon/home.svg
    route: /
  - text: 文章
    icon: /icon/article.svg
    route: /posts/
    pageTitle: page_posts
    pageDesc: page_posts_desc
  - text: 标签
    icon: /icon/tag.svg
    route: /tags/
    pageTitle: page_tags
    pageDesc: page_tags_desc
  - text: 分类
    icon: /icon/category.svg
    route: /categories/
    pageTitle: page_categories
    pageDesc: page_categories_desc
  - text: 动态
    icon: /icon/chat.svg
    route: /talks/
    pageTitle: page_moments
    pageDesc: page_moments_desc
  - text: 关于
    icon: /icon/person.svg
    route: /about/
  - text: 归档
    icon: /icon/archive.svg
    route: /archives/
    pageTitle: page_archives
    pageDesc: page_archives_desc
  - text: 友链
    icon: /icon/friends.svg
    route: /friends/
    pageTitle: page_friends
    pageDesc: page_friends_desc

# ===== 功能开关 =====
features:
  # 文章页的评论表单与评论列表
  comments: true
  # 状态页里需要访客权限的日历
  calendar: true
  # 顶栏搜索入口与 /search/ 页面
  search: true
  # 关于页连点 7 次头像进入 2048 小游戏
  easterEgg: true
  # /rss.xml 订阅源
  rss: true
  # /sitemap.xml 站点地图
  sitemap: true

# ===== 列表与摘要 =====
excerpt:
  # 首页卡片摘要保留的字符数（无封面时）
  length: 200
  # 有封面时摘要保留的字符数（封面已提供信息，摘要可以更短）
  lengthWithCover: 120

# RSS 订阅源包含的文章数量
rssLimit: 20

# ===== 个人名片页 /profile/ =====
# 一个独立的、全屏沉浸式的个人主页：高斯模糊夜景背景 + 毛玻璃卡片。
# 它不套用站点外壳（没有侧栏和顶栏），因此适合作为个人名片 / 导航页使用。
# 想让它出现在侧边栏，只需在上面的 menu 里加一项，例如：
#   - text: 主页
#     icon: /icon/person.svg
#     route: /profile/
profile:
  # 是否启用该页面
  enabled: true

  # 强调色。留空则跟随站点主题色（theme.color），改主题色时本页一起变。
  # 想固定成别的颜色（例如最初规格里的蓝色）就写死，如 '#4da3ff'。
  accent: ''

  # 圆形头像（带霓虹发光圆环）
  avatar: /img/avatar.jpg

  # 头像上方的小字、主标题、以及下方的一句签名
  greeting: Hi, I am
  name: X-LeeHe
  tagline: 警惕赛博杂食性动物

  # 背景图（可选）。会施加高斯模糊，建议用夜景照片。
  # 留空时使用内置的夜色渐变 + 缓慢浮动的光点（萤火虫效果），无需任何图片资源。
  background: ''

  # 兴趣 / 身份标签，按行分组，每行一个数组，渲染为圆角胶囊徽章
  tags:
    - [ArchLinuxUser, Mild DIY enthusiast]
    - [Robotics (idiot), Minecraft, Helldivers 2]

  # 右侧导航条。action 取值：
  #   link   —— 右侧显示 › 箭头，点击跳转 href
  #   expand —— 右侧显示 ⌄ 箭头，点击展开面板（子项或音乐播放器）
  # icon 可选：github | blog | more | music | link | mail | rss
  buttons:
    - text: Github
      icon: github
      href: https://github.com/imitoy
      action: link
    - text: Blog
      icon: blog
      href: /posts/
      action: link
    - text: More
      icon: more
      action: expand
      items:
        - { text: 归档, href: /archives/ }
        - { text: 标签, href: /tags/ }
        - { text: 友链, href: /friends/ }
        - { text: RSS, href: /rss.xml }
    - text: Music (From NetEase)
      icon: music
      action: expand
      music: true

  # 音乐面板内容（配合上面 music: true 的那一项）
  music:
    title: ''
    artist: ''
    cover: ''
    # 方式一：音频直链，用浏览器原生播放器播放（推荐，无需外部依赖）
    audio: ''
    # 方式二：网易云等平台的 iframe 外链播放器地址，例如
    # https://music.163.com/outchain/player?type=2&id=SONG_ID&auto=0&height=66
    # 填了它就会以 iframe 嵌入，并自动把该来源加入页面的 frame-src 白名单。
    embed: ''

# ===== 界面文案（可选覆盖）=====
# 内置文案已覆盖全部界面文字，键名见 src/site-config.ts 的 DEFAULT_STRINGS。
# 这里写上同名键即可覆盖，例如：
# strings:
#   page_posts: 博客
#   page_posts_desc: 全部文章列表
#   no_posts: 还没有发布任何文章
strings: {}
